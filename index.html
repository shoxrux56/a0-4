<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oila a'zolari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#4B4B4B; --ink-strong:#3C3C3C; --muted:#AFAFAF; --muted-2:#777777;
  --line:#E5E5E5; --line-shadow:#CECECE;
  --green:#58CC02; --green-shadow:#58A700; --green-soft:#D7FFB8; --green-ink:#58A700;
  --blue:#1CB0F6; --blue-shadow:#1899D6; --blue-soft:#DDF4FF; --blue-line:#84D8FF; --blue-ink:#1899D6;
  --red:#FF4B4B; --red-shadow:#EA2B2B; --red-soft:#FFDFE0; --red-ink:#EA2B2B;
  --gold:#FFC800; --gold-shadow:#E5B400; --orange:#FF9600;
  --apron:#FFFFFF; --skin:#FFDDB8; --eye:#3C3C3C;
  --f:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131F24; --surface:#131F24; --ink:#DCE6EC; --ink-strong:#F1F7FB; --muted:#6B7F89; --muted-2:#8FA3AD;
    --line:#37464F; --line-shadow:#2B3A42;
    --green-soft:#1D3A10; --green-ink:#89E219;
    --blue-soft:#143240; --blue-line:#1899D6; --blue-ink:#49C0F8;
    --red-soft:#3E1B1D; --red-ink:#FF7878;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#131F24; --ink:#DCE6EC; --ink-strong:#F1F7FB; --muted:#6B7F89; --muted-2:#8FA3AD;
  --line:#37464F; --line-shadow:#2B3A42;
  --green-soft:#1D3A10; --green-ink:#89E219;
  --blue-soft:#143240; --blue-line:#1899D6; --blue-ink:#49C0F8;
  --red-soft:#3E1B1D; --red-ink:#FF7878;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:700 17px/1.4 var(--f);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.view{min-height:100%;width:100%;max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* Tugmalar */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 20px;font:800 16px/1.1 var(--f);letter-spacing:.08em;text-transform:uppercase;text-align:center;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-shadow);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--green-shadow)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.bad{background:var(--red);box-shadow:0 4px 0 var(--red-shadow)}
.btn.bad:active:not(:disabled){box-shadow:0 0 0 var(--red-shadow)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-shadow)}
.btn.blue:active:not(:disabled){box-shadow:0 0 0 var(--blue-shadow)}
.btn.ghost{background:var(--surface);color:var(--blue-ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:13px 18px}
.btn.ghost:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--muted-2)}
.speak{border:0;background:var(--blue);color:#fff;border-radius:14px;width:44px;height:44px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--blue-shadow)}
.speak:active{transform:translateY(4px);box-shadow:0 0 0 var(--blue-shadow)}

/* Boshlash ekrani */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;min-height:100dvh}
#splash[hidden]{display:none}
#splash .btn{max-width:320px}
.camel{width:190px;animation:bobc 1s ease-in-out infinite alternate}
.camel svg{display:block;width:100%}
@keyframes bobc{to{transform:translateY(-8px)}}

/* Bosh sahifa */
.hbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:12px;border-bottom:2px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.flag{display:flex;align-items:center;gap:8px;font:900 16px/1 var(--f);color:var(--ink-strong);margin-right:auto}
.flag i{display:block;width:32px;height:22px;border-radius:5px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#fff 0 33.3%,#1C57A5 33.3% 66.6%,#D52B1E 66.6%)}
.stat{display:inline-flex;align-items:center;gap:6px;font:900 17px/1 var(--f);font-variant-numeric:tabular-nums;border:0;background:transparent;padding:6px 4px}
.stat.xp{color:var(--gold-shadow)}
.stat.hp{color:var(--red)}
.stat.snd{color:var(--muted)}
.stat.snd[aria-pressed="true"]{color:var(--blue)}
.unit{margin-block:20px 6px;background:var(--green);color:#fff;border-radius:18px;box-shadow:0 5px 0 var(--green-shadow);padding:16px 18px;display:flex;align-items:center;gap:14px}
.unit .u1{font:800 13px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit h1{margin:6px 0 2px;font:900 clamp(22px,6.4vw,28px)/1.15 var(--f);text-wrap:balance}
.unit .u3{font:700 15px/1.2 var(--f);opacity:.92}
.unit svg{flex:none;width:64px;height:auto;margin-left:auto}
.path{list-style:none;margin:0;padding:18px 0 8px;display:flex;flex-direction:column;align-items:center;gap:26px;overflow-x:clip}
.path li{width:100%;display:flex;justify-content:center}
.stg{position:relative;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateX(var(--dx,0px));min-width:160px}
.bub{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--green);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font:900 14px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.node{width:80px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--green);box-shadow:0 8px 0 var(--green-shadow);color:#fff;transition:transform .08s,box-shadow .08s}
.stg:active:not(:disabled) .node{transform:translateY(6px);box-shadow:0 2px 0 var(--green-shadow)}
.stg.done .node{background:var(--gold);box-shadow:0 8px 0 var(--gold-shadow)}
.stg.locked .node{background:var(--line);box-shadow:0 8px 0 var(--line-shadow);color:var(--muted)}
.stg:disabled{cursor:not-allowed}
.stg.cur .node{outline:6px solid var(--green-soft);outline-offset:4px}
.lbl{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;text-align:center}
.lbl b{font:900 16px/1.2 var(--f);color:var(--ink-strong)}
.lbl span{font:700 13px/1.2 var(--f);color:var(--muted-2)}
.stg.locked .lbl b{color:var(--muted)}
.sm-stars{display:flex;gap:2px;height:16px}
.sm-stars svg{width:16px;height:16px}
.foot{padding-block:18px 32px;display:flex;justify-content:center}
.link{border:0;background:transparent;color:var(--muted);font:800 13px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;padding:12px}

/* O'yin */
#game{height:100vh;height:100dvh;display:flex;flex-direction:column}
#game[hidden],#home[hidden],#result[hidden]{display:none}
.topbar{display:flex;align-items:center;gap:14px;padding-block:14px 6px}
.track{flex:1;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:var(--green);transition:width .35s ease;position:relative}
.fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:#fff;opacity:.3}
.hearts{display:flex;align-items:center;gap:6px;font:900 18px/1 var(--f);color:var(--red);font-variant-numeric:tabular-nums}
.stagebox{flex:1;min-height:0;overflow-y:auto;padding-block:16px;display:flex;flex-direction:column;gap:20px}
.q{font:900 clamp(22px,6.2vw,26px)/1.25 var(--f);color:var(--ink-strong);text-wrap:balance;margin:0}
.q small{display:block;font:800 12px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.speech{display:flex;align-items:center;gap:6px}
.speech > svg{flex:none;width:76px;height:auto}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble .row1{display:flex;align-items:center;gap:12px}
.bubble .w{font:900 clamp(26px,8vw,34px)/1.15 var(--f);color:var(--ink-strong);overflow-wrap:anywhere;flex:1;min-width:0}
.bubble .uzl{font:800 19px/1.3 var(--f);color:var(--ink-strong)}
.bubble .hint{font:700 14px/1.4 var(--f);color:var(--muted-2)}
.big{display:flex;align-items:center;gap:12px}
.bigword{font:900 clamp(30px,10vw,42px)/1.15 var(--f);color:var(--ink-strong);overflow-wrap:anywhere;border-bottom:3px dotted var(--blue-line);padding-bottom:2px}
.bigword.sm{font-size:clamp(20px,5.8vw,26px);line-height:1.3}
.opts{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;font:800 18px/1.3 var(--f);color:var(--ink);min-width:0}
.tile .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:800 13px/1 var(--f);color:var(--muted)}
.tile:hover:not(:disabled){background:color-mix(in srgb,var(--line) 25%,var(--surface))}
.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.tile.sel{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-ink)}
.tile.sel .k{border-color:var(--blue-line);color:var(--blue-ink)}
.tile.good{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.tile.good .k{border-color:var(--green);color:var(--green-ink)}
.tile.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.tile.wrong .k{border-color:var(--red);color:var(--red-ink)}
.tile:disabled{cursor:default}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.pairs .col{display:grid;gap:10px;min-width:0}
.pairs .tile{justify-content:center;text-align:center;padding:16px 8px;font-size:17px;overflow-wrap:anywhere}
.tile.matched{opacity:.5;border-color:var(--line);background:var(--bg);color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.line{min-height:112px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background-image:linear-gradient(to bottom,transparent 0 52px,var(--line) 52px 54px);background-size:100% 54px;background-repeat:repeat-y}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}
.chip{height:46px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:0 14px;font:800 18px/1 var(--f);color:var(--ink)}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip.ghost{background:var(--line);border-color:var(--line);color:transparent;border-bottom-width:2px}
.fillline{font:900 clamp(24px,7.4vw,32px)/1.4 var(--f);color:var(--ink-strong);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.blank{min-width:100px;min-height:48px;padding:2px 14px;border-bottom:3px solid var(--line);color:var(--blue-ink);text-align:center}
.blank.has{border:2px solid var(--blue-line);background:var(--blue-soft);border-radius:12px}
.blank.good{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.blank.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.optrow{display:flex;flex-wrap:wrap;gap:10px}
.optrow .tile{width:auto}
.ex{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.ex .ru{font:800 19px/1.3 var(--f);color:var(--ink-strong);overflow-wrap:anywhere}
.ex .tr{color:var(--muted-2);font-size:15px;font-weight:700}
.note{background:var(--blue-soft);color:var(--blue-ink);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:800}
.pron{font:800 15px/1.3 var(--f);color:var(--blue-ink)}

.dock{flex:none;padding:16px max(16px,env(safe-area-inset-left,0px)) 16px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-top:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:14px}
.dock.ok{background:var(--green-soft);border-top-color:transparent}
.dock.bad{background:var(--red-soft);border-top-color:transparent}
.fb{display:none;align-items:center;gap:14px}
.dock.ok .fb,.dock.bad .fb{display:flex}
.fb .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.dock.ok .fb .ic{color:var(--green)}
.dock.bad .fb .ic{color:var(--red)}
.fb .t{font:900 22px/1.2 var(--f)}
.fb .s{margin-top:2px;font-weight:800;font-size:16px;line-height:1.3}
.dock.ok .fb{color:var(--green-ink)}
.dock.bad .fb{color:var(--red-ink)}

/* Natija */
#result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:28px}
#result[hidden]{display:none}
#result svg.mascot{width:130px;height:auto;animation:hop 1s ease-out both}
@keyframes hop{0%{transform:translateY(30px) scale(.8);opacity:0}60%{transform:translateY(-10px)}100%{transform:none;opacity:1}}
#result h1{margin:0;font:900 clamp(26px,8vw,32px)/1.15 var(--f);color:var(--gold)}
#result h1.sad{color:var(--red)}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:58px;height:58px;animation:pop .5s both}
.bigstars svg:nth-child(2){animation-delay:.18s}
.bigstars svg:nth-child(3){animation-delay:.36s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:none}}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sbox{border:2px solid var(--c);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.sbox span{background:var(--c);color:#fff;font:900 11px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;padding:7px 4px}
.sbox b{padding:16px 4px;font:900 24px/1 var(--f);color:var(--c);font-variant-numeric:tabular-nums}
.res-actions{display:grid;gap:12px;width:100%}
#result p{margin:0;color:var(--muted-2);max-width:34ch;font-weight:700}

/* Kichik ekranlar */
@media (max-width:380px){
  .unit{padding:14px}
  .unit svg{width:52px}
  .speech > svg{width:56px}
  .tile{font-size:16px;padding:12px 14px}
  .chip{font-size:16px;padding:0 11px;height:42px}
  .stg{min-width:130px}
  .res-stats{gap:6px}
  .sbox b{font-size:20px}
}
@media (max-height:620px){
  .stagebox{gap:12px;padding-block:10px}
  #result svg.mascot{width:90px}
  .bigstars svg{width:42px;height:42px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" style="height:100%">
<!-- BOSHLASH EKRANI -->
<section id="splash" class="view">
  <div class="camel"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#d9a05b"><path d="M16 58Q8 62 10 78" stroke="#c98b45" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="24" y="70" width="9" height="24" rx="4.5"/><rect x="38" y="72" width="9" height="22" rx="4.5"/><rect x="56" y="72" width="9" height="22" rx="4.5"/><rect x="70" y="70" width="9" height="24" rx="4.5"/><ellipse cx="37" cy="38" rx="11" ry="15" fill="#c98b45"/><ellipse cx="60" cy="38" rx="11" ry="15" fill="#c98b45"/><ellipse cx="49" cy="62" rx="32" ry="19"/><path d="M66 58Q80 54 76 30L90 30Q92 58 82 72Z"/><ellipse cx="85" cy="26" rx="12" ry="9"/></g><ellipse cx="49" cy="64" rx="15" ry="9" fill="#1cb0f6"/><ellipse cx="49" cy="64" rx="8" ry="4" fill="#ffc800"/><ellipse cx="78" cy="15" rx="3" ry="5" fill="#c98b45"/><circle cx="83" cy="23" r="3.5" fill="#3c3c3c"/><circle cx="84" cy="22" r="1.2" fill="#fff"/><circle cx="90" cy="30" r="3" fill="#ff8a8a" opacity=".7"/><path d="M92 25q2 1 2 4" stroke="#8a5a28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
  <button class="btn" id="startBtn" type="button">Boshlash</button>
</section>

<!-- BOSH SAHIFA -->
<section id="home" class="view" hidden>
  <header class="hbar">
    <div class="flag"><i aria-hidden="true"></i>Rus tili</div>
    <span class="stat xp" id="xpStat"></span>
    <span class="stat hp" id="hpStat"></span>
    <button class="stat snd" id="sndBtn" type="button" aria-label="Tovush"></button>
  </header>
  <div class="unit">
    <div>
      <div class="u1">1-dars</div>
      <h1>Oila a'zolari</h1>
      <div class="u3">Члены семьи</div>
    </div>
    <svg viewBox="0 0 120 150" aria-hidden="true"><use href="#matr"/></svg>
  </div>
  <ol class="path" id="path"></ol>
  <div class="foot"><button class="link" id="resetBtn" type="button">Natijalarni tozalash</button></div>
</section>

<!-- O'YIN -->
<section id="game" class="view" hidden>
  <div class="topbar">
    <button class="icon-btn" id="quitBtn" type="button" aria-label="Chiqish">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill"></div></div>
    <div class="hearts" aria-label="Yuraklar"><span id="heartSvg"></span><span id="heartN">5</span></div>
  </div>
  <div class="stagebox" id="stagebox"></div>
  <div class="dock" id="dock">
    <div class="fb"><span class="ic" id="fbIc"></span><div><div class="t" id="fbT"></div><div class="s" id="fbS"></div></div></div>
    <button class="btn" id="act" type="button">Tekshirish</button>
  </div>
</section>

<!-- NATIJA -->
<section id="result" class="view" hidden></section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="matr">
      <path d="M84 138C110 138 120 112 108 90 104 108 96 114 82 114z" fill="#FF9600"/>
      <path d="M108 90C104 108 100 112 96 114c10 2 20-6 20-16 0-4-3-8-8-8z" fill="#fff"/>
      <path d="M28 150C28 118 42 104 60 104s32 14 32 46z" fill="#FF9600"/>
      <ellipse cx="60" cy="134" rx="14" ry="20" fill="#fff"/>
      <path d="M22 54L18 10 54 32z" fill="#FF9600"/><path d="M98 54L102 10 66 32z" fill="#FF9600"/>
      <path d="M28 44L26 22 44 34z" fill="#FFC48A"/><path d="M92 44L94 22 76 34z" fill="#FFC48A"/>
      <ellipse cx="60" cy="62" rx="39" ry="33" fill="#FF9600"/>

  try{if(!AUe)AUe=new Audio();AUe.onended=done||null;AUe.src=d;var p=AUe.play();if(p&&p.catch)p.catch(function(){});return true;}catch(e){return false;}
}

var ac=null,SOUND=false,SID=0,VR=null;

function tone(seq){
  if(!save.sound||!SOUND)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    var t=ac.currentTime;
    seq.forEach(function(n,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=n;
      g.gain.setValueAtTime(0.0001,t+i*0.11);
      g.gain.exponentialRampToValueAtTime(0.18,t+i*0.11+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+0.22);
      o.connect(g);g.connect(ac.destination);o.start(t+i*0.11);o.stop(t+i*0.11+0.25);
    });
  }catch(e){}
}
var sfx={ok:function(){tone([660,880]);},bad:function(){tone([260,196]);},win:function(){tone([523,659,784,1047]);}};

function pickV(){try{VR=window.speechSynthesis.getVoices().filter(function(v){return /^ru/i.test(v.lang);})[0]||null;}catch(e){}}
try{pickV();window.speechSynthesis.onvoiceschanged=pickV;}catch(e){}

// Birinchi bosishda brauzer ovozni ochadi
function unlock(){unlockClip();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}
  try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;window.speechSynthesis.speak(u);}catch(e){}
}
function say(text){
  if(!save.sound||!SOUND)return;
  if(playClip(text))return;
  var id=++SID;pickV();
  if(!VR||!("speechSynthesis" in window))return;
  var started=false;
  var u=new SpeechSynthesisUtterance(text);
  u.lang="ru-RU";u.rate=0.85;u.voice=VR;
  u.onstart=function(){started=true;};
  window._u=u;
  try{window.speechSynthesis.cancel();}catch(e){}
  setTimeout(function(){try{window.speechSynthesis.speak(u);}catch(e){}},80);
}

var G=null;
var splash=$("#splash"),home=$("#home"),game=$("#game"),result=$("#result");
function view(v){splash.hidden=v!=="splash";home.hidden=v!=="home";game.hidden=v!=="game";result.hidden=v!=="result";window.scrollTo(0,0);}
function starsOf(id){return save.stars[id]||0;}
function unlocked(i){return i===0||starsOf(STAGES[i-1].id)>0;}
function nextStageIdx(){for(var i=0;i<STAGES.length;i++){if(unlocked(i)&&!starsOf(STAGES[i].id))return i;}return -1;}

/* ============ Bosh sahifa ============ */
function renderHome(){
  $("#xpStat").innerHTML=ICON.bolt+"<span>"+save.xp+"</span>";
  $("#hpStat").innerHTML=ICON.heart+"<span>5</span>";
  $("#sndBtn").innerHTML=ICON.sound(save.sound);
  $("#sndBtn").setAttribute("aria-pressed",save.sound?"true":"false");
  var nx=nextStageIdx();
  var ol=$("#path");ol.innerHTML="";
  STAGES.forEach(function(s,i){
    var li=el("li");
    var st=starsOf(s.id),open=unlocked(i);
    var b=el("button","stg"+(st?" done":"")+(!open?" locked":"")+(i===nx?" cur":""));
    b.type="button";b.disabled=!open;
    b.style.setProperty("--dx",Math.round(Math.sin(i*1.05)*58)+"px");
    if(i===nx)b.appendChild(el("span","bub",i===0&&!st?"Boshlash":"Davom"));
    var node=el("span","node");
    node.innerHTML=st?ICON.check:ICON.nodeStar;
    var lbl=el("span","lbl");
    lbl.appendChild(el("b",null,s.title));lbl.appendChild(el("span",null,s.ru));
    if(st){var sw=el("span","sm-stars");sw.innerHTML=[1,2,3].map(function(n){return ICON.star(n<=st);}).join("");lbl.appendChild(sw);}
    b.appendChild(node);b.appendChild(lbl);
    b.addEventListener("click",function(){startStage(i);});
    li.appendChild(b);ol.appendChild(li);
  });
}
$("#sndBtn").addEventListener("click",function(){save.sound=!save.sound;persist();renderHome();if(save.sound)sfx.ok();});
var resetArmed=false,resetTimer=null;
$("#resetBtn").addEventListener("click",function(){
  var b=$("#resetBtn");
  if(!resetArmed){resetArmed=true;b.textContent="Aniq tozalaymi? Yana bosing";resetTimer=setTimeout(function(){resetArmed=false;b.textContent="Natijalarni tozalash";},3500);return;}
  clearTimeout(resetTimer);resetArmed=false;b.textContent="Natijalarni tozalash";
  save.xp=0;save.stars={};persist();renderHome();
});

/* ============ O'yin ============ */
function startStage(i){
  var s=STAGES[i];
  G={i:i,s:s,queue:s.items.map(function(x){return Object.assign({},x);}),total:s.items.length,gone:0,hearts:5,right:0,wrong:0,xp:0,phase:"check",ok:false,cur:null,sel:null};
  $("#heartSvg").innerHTML=ICON.heart;
  updateHud();view("game");next();
}
function updateHud(){
  $("#heartN").textContent=String(G.hearts);
  var p=Math.round(G.gone/G.total*100);
  $("#fill").style.width=Math.max(p,5)+"%";
  $("#track").setAttribute("aria-valuenow",String(p));
}
var dock=$("#dock"),act=$("#act"),stagebox=$("#stagebox");
function setDock(mode,opts){
  opts=opts||{};
  dock.className="dock"+(mode==="ok"?" ok":mode==="bad"?" bad":"");
  act.className="btn"+(mode==="bad"?" bad":"");
  if(mode==="idle"){act.textContent="Tekshirish";act.disabled=!opts.ready;G.phase="check";}
  else if(mode==="intro"){act.textContent="Davom";act.disabled=false;G.phase="intro";}
  else{
    act.textContent=opts.last?"Tushunarli":"Davom";act.disabled=false;G.phase="next";
    $("#fbT").textContent=opts.title||"";$("#fbS").textContent=opts.sub||"";
    $("#fbIc").innerHTML=mode==="ok"?ICON.check:ICON.cross;
  }
}
function ready(on){act.disabled=!on;}
function next(){
  if(G.hearts<=0){return fail();}
  if(!G.queue.length){return finish();}
  var it=G.queue[0];G.cur=it;G.sel=null;
  stagebox.innerHTML="";stagebox.scrollTop=0;
  updateHud();
  ({intro:rIntro,choose:rChoose,build:rBuild,fill:rFill,pairs:rPairs})[it.t](it);
}
var OKMSG=["To'g'ri!","Barakalla!","Ajoyib!","Zo'r!","Mukammal!"];
function loseHeart(){G.hearts--;G.wrong++;updateHud();sfx.bad();}
function judge(ok,correctText){
  var it=G.cur;
  if(ok){
    G.right++;G.xp+=it.retried?5:10;sfx.ok();
    setDock("ok",{title:OKMSG[Math.floor(Math.random()*OKMSG.length)],sub:it.retried?"Endi esladingiz.":""});
  }else{
    loseHeart();
    setDock("bad",{title:"To'g'ri javob:",sub:correctText,last:G.hearts<=0});
  }
  G.queue.shift();
  if(ok){G.gone++;}
  else if(!it.retried){G.queue.push(Object.assign({},it,{retried:true}));}
  else{G.gone++;}
  updateHud();
}
act.addEventListener("click",function(){
  if(!G)return;
  if(G.phase==="intro"){G.queue.shift();G.gone++;next();}
  else if(G.phase==="next"){next();}
  else if(G.phase==="check"&&G.check){G.check();}
});
document.addEventListener("keydown",function(e){
  if(!G||game.hidden)return;
  if(e.key==="Enter"&&!act.disabled){e.preventDefault();act.click();}
  else if(/^[1-4]$/.test(e.key)&&G.keys&&G.phase==="check"){var f=G.keys[+e.key-1];if(f)f();}
});
$("#quitBtn").addEventListener("click",function(){G=null;renderHome();view("home");});

function qHead(label,text){var q=el("h2","q");q.appendChild(el("small",null,label));q.appendChild(document.createTextNode(text));return q;}
function speakBtn(txt){var b=el("button","speak");b.type="button";b.setAttribute("aria-label","Tinglash");b.innerHTML=ICON.speaker;b.addEventListener("click",function(){say(txt);});return b;}
function speechRow(bubble){var r=el("div","speech");r.insertAdjacentHTML("afterbegin",mascotSvg());r.appendChild(bubble);return r;}

  ex.appendChild(speakBtn(it.exRu));ex.appendChild(exb);
  stagebox.appendChild(ex);

/* ---- Tanlash ---- */
function rChoose(it){
  stagebox.appendChild(qHead("Savol",it.q));
  if(it.big){
    var b=el("div","big");
    if(/[а-яё]/i.test(it.big))b.appendChild(speakBtn(it.big));
    b.appendChild(el("div","bigword"+(it.big.length>14?" sm":""),it.big));
    stagebox.appendChild(b);
  }
  var opts=el("div","opts");var tiles=[];
  shuffle(it.options).forEach(function(o,i){
    var t=el("button","tile");t.type="button";
    t.appendChild(el("span","k",String(i+1)));t.appendChild(el("span",null,o));
    t.addEventListener("click",function(){pick(t,o);});
    opts.appendChild(t);tiles.push({t:t,o:o});
  });
  stagebox.appendChild(opts);
  function pick(t,o){
    if(G.phase!=="check")return;
    tiles.forEach(function(x){x.t.classList.remove("sel");});
    t.classList.add("sel");G.sel=o;ready(true);
  }
  G.keys=tiles.map(function(x){return function(){pick(x.t,x.o);};});
  G.check=function(){
    if(G.sel==null)return;
    var ok=G.sel===it.answer;
    tiles.forEach(function(x){x.t.disabled=true;
      if(x.o===it.answer)x.t.classList.add("good");
      else if(x.o===G.sel)x.t.classList.add("wrong");
      x.t.classList.remove("sel");});
    judge(ok,it.answer);
  };
  setDock("idle",{ready:false});
}

/* ---- Gap tuzish ---- */
function rBuild(it){
  G.keys=null;
  stagebox.appendChild(qHead("Tarjima","Bu gapni ruscha yozing"));
  var bub=el("div","bubble");bub.appendChild(el("div","uzl",it.uz));
  if(it.hint)bub.appendChild(el("div","hint",it.hint));
  stagebox.appendChild(speechRow(bub));
  var line=el("div","line");var bank=el("div","bank");
  stagebox.appendChild(line);stagebox.appendChild(bank);
  var words=shuffle(it.tokens.concat(it.extra)).map(function(w,i){return {w:w,id:i};});
  var placed=[];var locked=false;
  function draw(){
    line.innerHTML="";bank.innerHTML="";
    placed.forEach(function(o){
      var c=el("button","chip",o.w);c.type="button";
      c.addEventListener("click",function(){if(locked)return;placed.splice(placed.indexOf(o),1);draw();});
      line.appendChild(c);
    });
    words.forEach(function(o){
      var used=placed.indexOf(o)>-1;
      var c=el("button","chip"+(used?" ghost":""),o.w);c.type="button";c.disabled=used;
      c.addEventListener("click",function(){if(locked)return;placed.push(o);draw();});
      bank.appendChild(c);
    });
    ready(placed.length>0&&!locked);
  }
  draw();
  G.check=function(){
    locked=true;
    var got=placed.map(function(o){return o.w;}).join(" ");
    var want=it.tokens.join(" ");
    var ok=got===want;
    Array.prototype.forEach.call(line.children,function(c){c.disabled=true;c.style.borderColor=ok?"var(--green)":"var(--red)";c.style.background=ok?"var(--green-soft)":"var(--red-soft)";c.style.color=ok?"var(--green-ink)":"var(--red-ink)";});
    Array.prototype.forEach.call(bank.children,function(c){c.disabled=true;});
    judge(ok,want);
  };
  setDock("idle",{ready:false});
}

/* ---- Bo'sh joyni to'ldirish ---- */
function rFill(it){
  stagebox.appendChild(qHead("To'ldiring","Bo'sh joyga to'g'ri so'zni qo'ying"));
  var bub=el("div","bubble");bub.appendChild(el("div","uzl",it.uz));
  stagebox.appendChild(speechRow(bub));
  var fl=el("div","fillline");
  if(it.before)fl.appendChild(el("span",null,it.before));
  var blank=el("span","blank"," ");fl.appendChild(blank);
  if(it.after)fl.appendChild(el("span",null,it.after));
  stagebox.appendChild(fl);
  var row=el("div","optrow");var tiles=[];
  shuffle(it.options).forEach(function(o){
    var t=el("button","tile",o);t.type="button";
    t.addEventListener("click",function(){pick(t,o);});
    row.appendChild(t);tiles.push({t:t,o:o});
  });
  stagebox.appendChild(row);
  function pick(t,o){
    if(G.phase!=="check")return;
    tiles.forEach(function(x){x.t.classList.remove("sel");});
    t.classList.add("sel");blank.textContent=o;blank.classList.add("has");G.sel=o;ready(true);
  }
  G.keys=tiles.map(function(x){return function(){pick(x.t,x.o);};});
  G.check=function(){
    if(G.sel==null)return;
    var ok=G.sel===it.answer;
    tiles.forEach(function(x){x.t.disabled=true;x.t.classList.remove("sel");
      if(x.o===it.answer)x.t.classList.add("good");else if(x.o===G.sel)x.t.classList.add("wrong");});
    blank.classList.add(ok?"good":"wrong");
    judge(ok,[it.before,it.answer,it.after].filter(Boolean).join(" "));
  };
  setDock("idle",{ready:false});
}

/* ---- Juftlash ---- */
function rPairs(it){
  G.check=null;G.keys=null;
  stagebox.appendChild(qHead("Juftlang","Har bir so'zga tarjimasini toping"));
  var wrap=el("div","pairs");var L=el("div","col"),R=el("div","col");
  wrap.appendChild(L);wrap.appendChild(R);stagebox.appendChild(wrap);
  var left=shuffle(it.list.map(function(p,i){return {id:i,text:p[0]};}));
  var right=shuffle(it.list.map(function(p,i){return {id:i,text:p[1]};}));
  var selL=null,selR=null,matched=0,busy=false;
  function mk(o,side,col){
    var t=el("button","tile",o.text);t.type="button";
    t.addEventListener("click",function(){
      if(busy||t.classList.contains("matched"))return;
      if(side==="L"){say(o.text);if(selL)selL.t.classList.remove("sel");selL={o:o,t:t};}
      else{if(selR)selR.t.classList.remove("sel");selR={o:o,t:t};}
      t.classList.add("sel");
      if(selL&&selR)resolve();
    });
    col.appendChild(t);
  }
  left.forEach(function(o){mk(o,"L",L);});
  right.forEach(function(o){mk(o,"R",R);});
  function resolve(){
    var a=selL,b=selR;busy=true;
    if(a.o.id===b.o.id){
      a.t.classList.remove("sel");b.t.classList.remove("sel");
      a.t.classList.add("matched");b.t.classList.add("matched");a.t.disabled=b.t.disabled=true;
      selL=selR=null;busy=false;matched++;G.right++;G.xp+=3;sfx.ok();
      if(matched===it.list.length){
        G.xp+=4;G.queue.shift();G.gone++;updateHud();
        setDock("ok",{title:"Hammasini topdingiz!",sub:""});
      }
    }else{
      a.t.classList.add("wrong");b.t.classList.add("wrong");
      a.t.classList.add("shake");b.t.classList.add("shake");
      loseHeart();
      setTimeout(function(){
        a.t.classList.remove("wrong","sel","shake");b.t.classList.remove("wrong","sel","shake");
        selL=selR=null;busy=false;
        if(G.hearts<=0)fail();
      },520);
    }
  }
  setDock("idle",{ready:false});
  act.disabled=true;act.textContent="Juftlang";
}

/* ============ Natija ============ */
function sbox(label,val,color){return '<div class="sbox" style="--c:'+color+'"><span>'+label+'</span><b>'+val+'</b></div>';}
function finish(){
  var m=G.wrong;var stars=m===0?3:(m<=2?2:1);
  var gain=G.xp+(stars*5);
  save.xp+=gain;save.stars[G.s.id]=Math.max(starsOf(G.s.id),stars);persist();
  var tot=G.right+G.wrong;var acc=tot?Math.round(G.right/tot*100):100;
  var isLast=G.i===STAGES.length-1;
  var allDone=STAGES.every(function(s){return starsOf(s.id)>0;});
  var i=G.i;
  sfx.win();
  result.innerHTML=mascotSvg()+
   '<h1>'+(isLast&&allDone?"1-dars tugadi!":"Bosqich tugadi!")+'</h1>'+
   '<div class="bigstars">'+[1,2,3].map(function(n){return ICON.star(n<=stars);}).join("")+'</div>'+
   '<div class="res-stats">'+sbox("Jami XP","+"+gain,"#FFC800")+sbox("Aniqlik",acc+"%","#58CC02")+sbox("Yurak",String(G.hearts),"#FF4B4B")+'</div>'+
   '<p>'+(stars===3?"Xatosiz! Rus tilida gapirishga tayyorsiz.":stars===2?"Yaxshi natija. Xatolar ustida yana bir urinib ko'ring.":"Boshlanishiga yomon emas. Qayta o'ynasangiz, yulduzlar ko'payadi.")+'</p>'+
   '<div class="res-actions"></div>';
  var box=result.querySelector(".res-actions");
  var nx=nextStageIdx();
  var go=nx!==-1&&!isLast;
  var b1=el("button","btn",go?"Keyingi bosqich":"Xaritaga qaytish");b1.type="button";
  b1.addEventListener("click",function(){if(go){startStage(nx);}else{G=null;renderHome();view("home");}});
  var b2=el("button","btn ghost","Qayta o'ynash");b2.type="button";b2.addEventListener("click",function(){startStage(i);});
  var b3=el("button","btn ghost","Xarita");b3.type="button";b3.addEventListener("click",function(){G=null;renderHome();view("home");});
  box.appendChild(b1);box.appendChild(b2);if(go)box.appendChild(b3);
  view("result");
}
function fail(){
  var i=G.i;
  result.innerHTML=mascotSvg()+
   '<h1 class="sad">Yuraklar tugadi</h1>'+
   '<p>Hechqisi yo\'q. Xato qilish o\'rganishning bir qismi. Qaytadan urinib ko\'ring.</p>'+
   '<div class="res-actions"></div>';
  var box=result.querySelector(".res-actions");
  var b1=el("button","btn","Qayta urinish");b1.type="button";b1.addEventListener("click",function(){startStage(i);});
  var b2=el("button","btn ghost","Xarita");b2.type="button";b2.addEventListener("click",function(){G=null;renderHome();view("home");});
  box.appendChild(b1);box.appendChild(b2);
  view("result");
}

/* ============ Boshlash tugmasi ============ */
$("#startBtn").addEventListener("click",function(){
  SOUND=true;
  unlock();
  setTimeout(function(){say("Привет!");},150);
  renderHome();view("home");
});
view("splash");
})();
</script>
